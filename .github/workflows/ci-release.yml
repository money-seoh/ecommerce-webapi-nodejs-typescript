name: CI and Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag to create, for example v1.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Create a temporary dependency lockfile
        run: npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # TODO: Gitleaks steps are disabled; re-enable and address in future.
      # - name: Scan commits for secrets
      #   uses: gitleaks/gitleaks-action@v2.3.9
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      #     GITLEAKS_ENABLE_COMMENTS: "false"
      #
      # - name: Scan full history for secrets
      #   run: gitleaks git --no-banner --redact --verbose .

  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: sqlserver://localhost:1433;database=ci;trustServerCertificate=true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  tests:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: sqlserver://localhost:1433;database=ci;trustServerCertificate=true

      - name: Run tests
        run: npm test -- --runInBand

  package:
    name: Package application
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_version must use the vX.Y.Z format (for example v1.2.0)"
            exit 1
          fi

      - name: Create package
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DATABASE_URL: sqlserver://localhost:1433;database=ci;trustServerCertificate=true
        run: |
          npm version "${RELEASE_VERSION#v}" --no-git-tag-version --allow-same-version
          npm install --ignore-scripts --no-audit --no-fund
          npm run prisma:generate
          npm run build
          mkdir -p artifacts/package/prisma
          cp -R dist artifacts/package/
          cp prisma/schema.prisma artifacts/package/prisma/schema.prisma
          cp package.json artifacts/package/
          tar -czf "artifacts/ecommerce-webapi-${RELEASE_VERSION}.tar.gz" -C artifacts/package .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-package
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package-approval:
    name: Approve package for release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: package-approval
    steps:
      - name: Confirm approval
        run: echo "Package approval granted; release may proceed."

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: package-approval
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: release-package
          path: artifacts

      - name: Create GitHub release
        run: gh release create "$RELEASE_VERSION" artifacts/*.tar.gz --title "$RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
